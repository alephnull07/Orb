<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 690" width="1780" height="690" role="img"
  aria-label="ORB pipeline: files are routed to text readers or a column mapper, become per-report claims, are squashed into one graph, compiled into balance equations, solved with weighted L1, decoded into state, losses and flags, shown as a graph, and explained by an analyst chat that produces actions."
  font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Times, serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1780" height="690" fill="#ffffff"/>
  <text x="890.0" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#000000">ORB: outlier-robust state estimation over conserved-flow networks</text><text x="890.0" y="72" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">y = Hx + a + e, with a sparse and unknown.  Recover x, locate supp(a), and say when the data cannot decide.</text><circle cx="80" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="80" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Files</text><circle cx="110.24" cy="231.76" r="10" fill="#000000"/><text x="110.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">1</text><circle cx="226" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="226" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Route</text><circle cx="256.24" cy="231.76" r="10" fill="#000000"/><text x="256.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">2</text><circle cx="380" cy="172" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="380" y="177" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Readers</text><circle cx="410.24" cy="141.76" r="10" fill="#000000"/><text x="410.24" y="145.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">3</text><circle cx="380" cy="352" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="380" y="349" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Column</text><text x="380" y="366" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">map</text><circle cx="410.24" cy="321.76" r="10" fill="#000000"/><text x="410.24" y="325.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">4</text><circle cx="540" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="540" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Claims</text><circle cx="570.24" cy="231.76" r="10" fill="#000000"/><text x="570.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">5</text><circle cx="700" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.9"/><text x="700" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Squash</text><circle cx="730.24" cy="231.76" r="10" fill="#000000"/><text x="730.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">6</text><circle cx="860" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="860" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Compile</text><circle cx="890.24" cy="231.76" r="10" fill="#000000"/><text x="890.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">7</text><circle cx="1020" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="1020" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">L1 solve</text><circle cx="1050.24" cy="231.76" r="10" fill="#000000"/><text x="1050.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">8</text><circle cx="1180" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="1180" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Decode</text><circle cx="1210.24" cy="231.76" r="10" fill="#000000"/><text x="1210.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">9</text><circle cx="1340" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="1340" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Graph</text><circle cx="1370.24" cy="231.76" r="10" fill="#000000"/><text x="1370.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">10</text><circle cx="1520" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="1520" y="259" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Analyst</text><text x="1520" y="276" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">chat</text><circle cx="1550.24" cy="231.76" r="10" fill="#000000"/><text x="1550.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">11</text><circle cx="1700" cy="262" r="42" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="1700" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#000000">Action</text><circle cx="1730.24" cy="231.76" r="10" fill="#000000"/><text x="1730.24" y="235.56" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">12</text><line x1="125.0" y1="262.0" x2="179.0" y2="262.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="264.9" y1="239.3" x2="339.4" y2="195.7" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><text x="288.1" y="209.5" text-anchor="middle" font-size="11" font-style="italic" fill="#333333">text</text><line x1="264.9" y1="284.7" x2="339.4" y2="328.3" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><text x="288.1" y="320.5" text-anchor="middle" font-size="11" font-style="italic" fill="#333333">table</text><line x1="419.2" y1="194.1" x2="499.0" y2="239.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="419.2" y1="329.9" x2="499.0" y2="285.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="585.0" y1="262.0" x2="653.0" y2="262.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="745.0" y1="262.0" x2="813.0" y2="262.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="905.0" y1="262.0" x2="973.0" y2="262.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="1065.0" y1="262.0" x2="1133.0" y2="262.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="1225.0" y1="262.0" x2="1293.0" y2="262.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="1385.0" y1="262.0" x2="1473.0" y2="262.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><line x1="1565.0" y1="262.0" x2="1653.0" y2="262.0" stroke="#000000" stroke-width="1.2" marker-end="url(#arr)"/><rect x="588" y="113" width="224" height="34" rx="17" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4"/><text x="700" y="135" text-anchor="middle" font-size="12" font-style="italic" fill="#000000">losses mode ∈ {none, known, unknown}</text><text x="700" y="104" text-anchor="middle" font-size="10.8" fill="#333333">chosen by the operator, never inferred from data</text><line x1="700" y1="147" x2="700" y2="214" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/><line x1="60" y1="418" x2="1720" y2="418" stroke="#666666" stroke-width="0.6"/><text x="60.0" y="440" font-size="12" fill="#000000"><tspan font-weight="700">1. Files.</tspan> Radio logs, field notes, JSON lines, spreadsheets. No schema is assumed and sites are named however people name them.</text><text x="60.0" y="464" font-size="12" fill="#000000"><tspan font-weight="700">2. Route.</tspan> Dispatch by extension only: text and JSONL go to the readers, tables to the column mapper. No model call is made here.</text><text x="60.0" y="488" font-size="12" fill="#000000"><tspan font-weight="700">3. Readers.</tspan> Three LLM personas each emit one claim per message, (from, to, qty, perspective, evidence); a claim survives a ≥2-of-3</text><text x="78.0" y="503.5" font-size="12" fill="#000000">vote and is weighted 1/(reader spread + λ).</text><text x="60.0" y="527.5" font-size="12" fill="#000000"><tspan font-weight="700">4. Column map.</tspan> One LLM call maps columns to node / edge / sink primitives from a stratified sample; every row then becomes a claim in</text><text x="78.0" y="543.0" font-size="12" fill="#000000">pure Python.</text><text x="60.0" y="567.0" font-size="12" fill="#000000"><tspan font-weight="700">5. Claims.</tspan> Each report is a row yᵢ = Hᵢx + aᵢ + eᵢ over the state x = (stock, flow, sink); sender and receiver rows stay separate</text><text x="78.0" y="582.5" font-size="12" fill="#000000">as two observations of one event.</text><text x="60.0" y="606.5" font-size="12" fill="#000000"><tspan font-weight="700">6. Squash.</tspan> Canonical ids unify names across files and events on one edge sum within an observer stream (file, channel); nothing</text><text x="78.0" y="622.0" font-size="12" fill="#000000">is averaged, medianed, or deduplicated.</text><text x="910.0" y="440" font-size="12" fill="#000000"><tspan font-weight="700">7. Compile.</tspan> A hard balance per node, q − Σin + Σout + s = q₀ − draws; identifiability requires rank[H; A] = n, and the guarantee</text><text x="928.0" y="455.5" font-size="12" fill="#000000">is k = ⌊(d − 1)/2⌋ with d the fewest rows whose removal blinds the balance.</text><text x="910.0" y="479.5" font-size="12" fill="#000000"><tspan font-weight="700">8. L1 solve.</tspan> minₓ Σ wᵢ |yᵢ − Hᵢx| + λ Σ s subject to Ax = b, solved as a linear program; sparse corruption concentrates in a few</text><text x="928.0" y="495.0" font-size="12" fill="#000000">residuals instead of leaking into every honest row.</text><text x="910.0" y="519.0" font-size="12" fill="#000000"><tspan font-weight="700">9. Decode.</tspan> Read q̂, f̂, ŝ, rank sinks as leak candidates, and flag |rᵢ| &gt; τ with file, channel and record; if flags exceed k the</text><text x="928.0" y="534.5" font-size="12" fill="#000000">run is declared past its guarantee.</text><text x="910.0" y="558.5" font-size="12" fill="#000000"><tspan font-weight="700">10. Graph.</tspan> Reported versus corrected network, node health, ranked losses, and flagged rows with provenance.</text><text x="910.0" y="582.5" font-size="12" fill="#000000"><tspan font-weight="700">11. Analyst chat.</tspan> Claude receives the recovered graph, residuals, flags, health and contacts as context, writes the briefing, and</text><text x="928.0" y="598.0" font-size="12" fill="#000000">answers next-step questions in a chat.</text><text x="910.0" y="622.0" font-size="12" fill="#000000"><tspan font-weight="700">12. Action.</tspan> Who to call, what to verify first, and how far to trust the estimate.</text><line x1="60" y1="644" x2="1720" y2="644" stroke="#666666" stroke-width="0.6"/><text x="60" y="664" font-size="11.5" fill="#333333">Fig. 1.  Every independent observation survives to the estimator as its own row; only the L1 objective decides which rows are wrong.  The guarantee k is computed before any answer is shown.</text>
</svg>